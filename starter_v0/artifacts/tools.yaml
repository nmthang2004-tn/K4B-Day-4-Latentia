# starter_v0 — intentionally incomplete first-draft declarations.
# Students improve routing guidance, argument conventions, missing-information
# handling, and confirmation boundaries through v1/v2/v3.
#
# Keep built-in names and supplied evaluation cases unchanged.
# Improve descriptions and compatible schemas. Declare team-built bonus tools
# here and in tools/__init__.py, then test them with team-authored cases.
tools:
  # ---------------- Core tools ----------------
  - name: clarify
    description: "Gửi một câu hỏi làm rõ hoặc xin xác nhận từ người dùng. BẮT BUỘC dùng khi: (1) Thiếu thông tin bắt buộc như asset_id (dạng XX-NNN), employee_id (dạng EMP-NNNN) -> dùng response_type='text'; (2) Môi trường (environment) mơ hồ hoặc không thuộc enum [production, staging] -> dùng response_type='choice' với options=['production', 'staging']; (3) Khi người dùng yêu cầu tạo ticket (create_ticket) -> BẮT BUỘC dùng response_type='yes_no' để xin người dùng xác nhận Có/Không. TUYỆT ĐỐI KHÔNG dùng response_type='text' khi xin xác nhận tạo ticket!"
    parameters:
      type: object
      properties:
        question: {type: string, default: "", description: "Câu hỏi làm rõ hoặc nội dung yêu cầu xác nhận"}
        response_type: {type: string, enum: [text, yes_no, choice], description: "Kiểu trả lời: BẮT BUỘC chọn 'yes_no' khi xin xác nhận tạo ticket (create_ticket); chọn 'text' khi cần hỏi thông tin định danh (asset_id, employee_id); chọn 'choice' khi có danh sách lựa chọn cụ thể"}
        options: {type: array, default: [], items: {type: string}, description: "Danh sách lựa chọn hợp lệ khi response_type là 'choice'"}
      required: [question, response_type]

  - name: search_kb
    description: "Tìm bài viết hướng dẫn hỗ trợ kỹ thuật nội bộ trong Knowledge Base. Dùng khi người dùng tìm kiếm hướng dẫn giải quyết sự cố, cách cấu hình thiết bị, hoặc tài liệu kỹ thuật."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Nội dung hoặc từ khóa cần tìm kiếm"}
        category: {type: string, enum: [all, vpn, email, wifi, printing, account, security, hardware, software, meeting_room], default: "all", description: "Nhóm danh mục hướng dẫn tương ứng với dịch vụ (ví dụ: vpn, email, wifi, security...)"}
        top_k: {type: integer, default: 3, description: "Số kết quả cần lấy"}
      required: [query]

  - name: check_service_status
    description: "Kiểm tra trạng thái hoạt động của một dịch vụ dùng chung (vpn, email, sso, wifi, printing). Chỉ hỗ trợ môi trường 'production' hoặc 'staging'. Nếu môi trường bị mơ hồ hoặc không rõ ràng (ví dụ: demo, test, qa), KHÔNG được tự ý gán mà PHẢI dùng clarify để hỏi người dùng lựa chọn giữa production hoặc staging."
    parameters:
      type: object
      properties:
        service: {type: string, enum: [vpn, email, sso, wifi, printing], description: "Tên dịch vụ cần kiểm tra"}
        environment: {type: string, enum: [production, staging], default: "production", description: "Môi trường: CHỈ chấp nhận 'production' hoặc 'staging'"}
      required: [service]

  - name: inspect_device
    description: "Kiểm tra thông tin và chẩn đoán một thiết bị cụ thể theo mã tài sản (asset_id dạng XX-NNN). BẮT BUỘC phải có asset_id cụ thể; nếu người dùng nói chung chung ('laptop của mình') mà chưa có mã, PHẢI gọi clarify để hỏi asset_id. Nếu kiểm tra một vấn đề/dịch vụ cụ thể (như VPN, Wi-Fi/mạng, bảo mật), PHẢI chọn giá trị 'check' tương ứng thay vì để mặc định 'all'."
    parameters:
      type: object
      properties:
        asset_id: {type: string, description: "Mã tài sản định danh thiết bị (ví dụ: LT-204, DT-031). Không tự ý đoán mã khi thiếu"}
        check: {type: string, enum: [all, network, vpn, security, hardware, software], default: "all", description: "Phạm vi kiểm tra cụ thể: vpn (cho sự cố VPN), network (cho sự cố mạng/Wi-Fi), security (bảo mật), hardware (phần cứng), software (phần mềm), all (chỉ khi kiểm tra tổng thể hoặc không nêu dịch vụ cụ thể)"}
      required: [asset_id]

  - name: lookup_user
    description: "Tra cứu thông tin người dùng trong danh bạ hỗ trợ theo mã nhân viên (định dạng EMP-NNNN). BẮT BUỘC phải có mã nhân viên cụ thể, nếu thiếu phải gọi clarify. LƯU Ý QUAN TRỌNG: Kết quả tra cứu người dùng ĐÃ BAO GỒM danh sách thiết bị được cấp (assigned_devices). KHÔNG gọi thêm inspect_device trừ khi người dùng yêu cầu kiểm tra kỹ thuật độc lập cho thiết bị đó."
    parameters:
      type: object
      properties:
        employee_id: {type: string, description: "Mã nhân viên (định dạng EMP-NNNN, ví dụ: EMP-1001, EMP-1003)"}
      required: [employee_id]

  - name: format_incident_report
    description: "Trình bày các kết quả đã thu thập thành báo cáo sự cố có cấu trúc (incident report). Dùng khi người dùng yêu cầu tổng hợp hoặc định dạng báo cáo sau khi đã chẩn đoán/kiểm tra. KHÔNG gọi lại các công cụ kiểm tra trước đó nếu dữ liệu đã có trong ngữ cảnh."
    parameters:
      type: object
      properties:
        findings:
          type: array
          default: []
          description: "Danh sách các kết quả đã thu thập từ các bước kiểm tra trước đó"
          items:
            type: object
            properties:
              label: {type: string, description: "Nhãn thành phần (ví dụ: Network, VPN, Hardware)"}
              detail: {type: string, description: "Chi tiết chẩn đoán hoặc trạng thái sự cố"}
              source: {type: string, description: "Nguồn thông tin (ví dụ: inspect_device, check_service_status)"}
              status: {type: string, description: "Tình trạng (healthy, degraded, failed...)"}
        template: {type: string, enum: [brief, technical, handoff], default: "brief", description: "Mẫu báo cáo: brief (tóm tắt ngắn), technical (báo cáo kỹ thuật chi tiết), handoff (bàn giao ca trực)"}
        incident_title: {type: string, default: "IT incident", description: "Tiêu đề của báo cáo sự cố"}
      required: [findings, template]

  # ---------------- Optional/advanced tools ----------------
  - name: search_device_info
    description: "Tìm kiếm thông tin công khai về một model thiết bị trên web. TUYỆT ĐỐI KHÔNG truyền mã tài sản nội bộ (như LT-xxx, DT-xxx), mã nhân viên (EMP-xxxx), email công ty hoặc bất kỳ dữ liệu nội bộ nào vào tham số. CHỈ truyền tên hãng công khai và dòng sản phẩm chung."
    parameters:
      type: object
      properties:
        manufacturer: {type: string, description: "Hãng sản xuất công khai (ví dụ: Lenovo, Dell, HP, Apple). Tuyệt đối không chứa ID nội bộ"}
        model: {type: string, description: "Tên model thương mại công khai (ví dụ: ThinkPad T14 Gen 4, Latitude 5420). Tuyệt đối không truyền mã tài sản (asset_id như LT-xxx hay DT-xxx)"}
        query_type: {type: string, enum: [specs, drivers, support, compatibility], default: "support", description: "Loại thông tin cần tìm: specs (thông số kỹ thuật), drivers (trình điều khiển), support (hỗ trợ), compatibility (tương thích)"}
        max_results: {type: integer, default: 3, description: "Số kết quả cần lấy, tối đa 5"}
      required: [manufacturer, model, query_type]

  - name: policy
    description: "Tìm trong chính sách và quy trình IT nội bộ của công ty. Dùng khi người dùng hỏi về quy định, quy trình xử lý sự cố, chính sách bảo mật hoặc quyền truy cập."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Nội dung hoặc từ khóa chính sách cần tìm"}
        policy_area: {type: string, enum: [all, access_control, data_privacy, external_tools, incident_response, service_operations, ticketing], default: "all", description: "Nhóm chính sách: incident_response (xử lý sự cố, báo cáo khẩn), access_control (quyền truy cập), data_privacy (bảo mật dữ liệu nhạy cảm), external_tools (quy định dùng web/tool ngoài), service_operations (vận hành), ticketing (quy định ticket), all (chung)"}
        top_k: {type: integer, default: 3, description: "Số mục chính sách cần lấy"}
      required: [query]

  - name: create_ticket
    description: "Tạo một ticket hỗ trợ kỹ thuật mới. ĐÂY LÀ HÀNH ĐỘNG GHI DỮ LIỆU CẦN XÁC NHẬN (CONFIRMATION BOUNDARY): TUYỆT ĐỐI KHÔNG gọi trực tiếp khi người dùng mới chỉ yêu cầu hoặc thay đổi thông tin ticket. BẮT BUỘC phải dùng clarify(response_type='yes_no') để xin xác nhận trước (ví dụ: 'Bạn có xác nhận tạo ticket lỗi VPN trên LT-204 mức high không?'). TUYỆT ĐỐI KHÔNG dùng clarify với response_type='text' khi người dùng đã cung cấp đủ thông tin sự cố trong câu lệnh. Chỉ khi người dùng đã xác nhận đồng ý thì mới gọi tool này với confirmed=true."
    parameters:
      type: object
      properties:
        summary: {type: string, default: "", description: "Tóm tắt sự cố (trích xuất trực tiếp từ yêu cầu của người dùng, ví dụ: 'Lỗi VPN trên LT-204')"}
        priority: {type: string, enum: [low, medium, high, critical], default: "medium", description: "Mức ưu tiên của ticket"}
        asset_id: {type: string, default: "", description: "Mã tài sản liên quan nếu có"}
        confirmed: {type: boolean, default: false, description: "Chỉ đặt true khi người dùng đã xác nhận đồng ý tạo ticket qua bước clarify trước đó"}
      required: [summary]

